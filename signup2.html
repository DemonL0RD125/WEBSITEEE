<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DG'S RESTAURANT</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup2.css">
</head>
<body>

  <div class="hero-bg"></div>

  <header class="top-bar">
    <a href="home.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT49MUAtyVv0DbccQaw7QUYANTXtJUIivwymSep_3dp9g&s=10" alt="DG's Restaurant logo" class="logo">
    </a>

    <nav class="top-nav">
      <a href="about.html">About Us</a>
      <a href="branches.html">Branches</a>
      <a href="menu.html">Menu</a>
    </nav>
  </header>

  <main class="login-main">
    <div class="login-card signup-card">
      <p class="login-label">DG'S RESTAURANT</p>
      <h1 class="login-title">Create Account</h1>
      <p class="login-sub">Step 2: Contact & Address</p>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: 50%;"></div>
        </div>
        <div class="progress-steps">
          <div class="step-node active">1</div>
          <div class="step-node active">2</div>
          <div class="step-node">3</div>
        </div>
      </div>

      <form id="signup2-form" class="login-form">
        <label for="mobile-number" class="field-label">Mobile Number</label>
        <input type="tel" id="mobile-number" class="field" placeholder="09123456789" required>

        <label for="address" class="field-label">Address</label>
        <input type="text" id="address" class="field" placeholder="Lopez Jaena Street, Brgy. Talaban" required>

        <label for="zip-code" class="field-label">Zip Code</label>
        <input type="text" id="zip-code" class="field" placeholder="6108" required>

        <p id="message" class="message"></p>

        <div class="step-actions">
          <button type="button" id="back-btn" class="secondary-btn">Back</button>
          <button type="submit" id="next-btn" class="login-btn">Next</button>
        </div>
      </form>

      <a href="login.html" class="back-link">Already have an account? Log In</a>
    </div>
  </main>

  <footer class="footer">
    <div>
      <h2 class="footer-title">Contact Us</h2>
      <p class="footer-text">(63+) 9068676619</p>
      <div class="footer-links">
        <a href="https://www.facebook.com/share/17qxEoa7Ds/" class="footer-btn">Facebook</a>
        <a href="#" class="footer-btn">Instagram</a>
      </div>
    </div>

    <div>
      <h2 class="footer-title">Visit Us</h2>
      <p class="footer-text">Lopez Jaena Street, Brgy. Talaban, Himamaylan City</p>
      <p>Mon - Sat: 7:00 AM to 12:00 AM</p>
    </div>
  </footer>

  <script type="module" src="signup2.js"></script>
</body>
</html>
