<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DG'S RESTAURANT</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin_login.css">
</head>
<body>

  <header class="top-bar">
    <div class="top-bar-left">
      <a href="home.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT49MUAtyVv0DbccQaw7QUYANTXtJUIivwymSep_3dp9g&s=10" alt="DG's Restaurant logo" class="logo">
      </a>
      <span class="admin-badge">Admin</span>
    </div>

  </header>

  <main class="login-main">
    <div class="login-container">
      <h1 class="login-title">Admin</h1>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <p id="error-msg" class="error-msg hidden">Invalid username or password. Please try again.</p>

        <button type="submit" class="login-btn">Log In</button>
      </form>
    </div>
  </main>

  <script type="module" src="admin_login.js"></script>
</body>
</html>
