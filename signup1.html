<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DG'S RESTAURANT</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup1.css">
</head>
<body>

  <div class="hero-bg"></div>

  <header class="top-bar">
    <a href="home.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT49MUAtyVv0DbccQaw7QUYANTXtJUIivwymSep_3dp9g&s=10" alt="DG's Restaurant logo" class="logo">
    </a>

    <nav class="top-nav">
      <a href="about.html">About Us</a>
      <a href="branches.html">Branches</a>
      <a href="menu.html">Menu</a>
    </nav>
  </header>

  <main class="login-main">
    <div class="login-card signup-card">
      <p class="login-label">DG'S RESTAURANT</p>
      <h1 class="login-title">Create Account</h1>
      <p class="login-sub">Step 1: Personal Information</p>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div class="progress-steps">
          <div class="step-node active">1</div>
          <div class="step-node">2</div>
          <div class="step-node">3</div>
        </div>
      </div>

      <form id="signup1-form" class="login-form">
        <label for="first-name" class="field-label">First Name</label>
        <input type="text" id="first-name" class="field" placeholder="John" required>

        <label for="middle-name" class="field-label">Middle Name</label>
        <input type="text" id="middle-name" class="field" placeholder="Dela">

        <label for="last-name" class="field-label">Last Name</label>
        <input type="text" id="last-name" class="field" placeholder="Cruz" required>

        <label for="birthdate-input" class="field-label">Birthdate</label>
        <div class="custom-calendar-container">
          <input type="text" id="birthdate-input" class="field calendar-input" placeholder="Select your birthdate" readonly required>
          <div id="custom-calendar" class="calendar-dropdown hidden">
            <div class="calendar-header">
              <button type="button" id="cal-prev" class="cal-nav-btn">&lsaquo;</button>
              <div class="cal-selects">
                <select id="cal-month-select" class="cal-select"></select>
                <select id="cal-year-select" class="cal-select"></select>
              </div>
              <button type="button" id="cal-next" class="cal-nav-btn">&rsaquo;</button>
            </div>
            <div class="calendar-weekdays">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div id="calendar-days" class="calendar-days"></div>
          </div>
        </div>

        <label for="age" class="field-label">Age</label>
        <input type="number" id="age" class="field" placeholder="Auto-calculated" readonly required>

        <p id="message" class="message"></p>

        <button type="submit" id="next-btn" class="login-btn">Next</button>
      </form>

      <a href="login.html" class="back-link">Already have an account? Log In</a>
    </div>
  </main>

  <footer class="footer">
    <div>
      <h2 class="footer-title">Contact Us</h2>
      <p class="footer-text">(63+) 9068676619</p>
      <div class="footer-links">
        <a href="https://www.facebook.com/share/17qxEoa7Ds/" class="footer-btn">Facebook</a>
        <a href="#" class="footer-btn">Instagram</a>
      </div>
    </div>

    <div>
      <h2 class="footer-title">Visit Us</h2>
      <p class="footer-text">Lopez Jaena Street, Brgy. Talaban, Himamaylan City</p>
      <p>Mon - Sat: 7:00 AM to 12:00 AM</p>
    </div>
  </footer>

  <script type="module" src="signup1.js"></script>
</body>
</html>
